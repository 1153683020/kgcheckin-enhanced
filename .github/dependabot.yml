version: 2
updates:
  # 根目录（eslint 等 devDependency）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # minor/patch 归组为一个 PR，减少噪音；major 单独开 PR 便于审查
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # api/（axios/express 等上游依赖）
  - package-ecosystem: "npm"
    directory: "/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions 版本更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
