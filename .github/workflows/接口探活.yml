name: 接口探活
on:
  schedule:
    # 每天中午北京时间 12:00 探活一次（与凌晨签到错开，失败可提前预警）
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 创建 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./api/package-lock.json
      - name: 缓存依赖
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ./api/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: 安装依赖
        run: npm run install
        if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
      # 探针走完整链路（本地服务 + 签名/加密 + 真实请求酷狗），无需登录态
      # 基线可通过 Repository Variable PROBE_BASELINE（JSON 数组）自定义覆盖
      # 全部正常时静默结束；任一失败则推送告警并以非零退出（Actions 会标红）
      - name: 执行探活
        run: node healthcheck.js
        env:
          PROBE_BASELINE: ${{ vars.PROBE_BASELINE }}
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
          DINGTALK_BOT_KEY: ${{ secrets.DINGTALK_BOT_KEY }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_BOT_KEY: ${{ secrets.FEISHU_BOT_KEY }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          YUNHU_BOT_KEY: ${{ secrets.YUNHU_BOT_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_GROUP: ${{ secrets.BARK_GROUP }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
